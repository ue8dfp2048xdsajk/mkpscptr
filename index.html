<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Generator Fabric Warp</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js">

document.getElementById("resetBtn").addEventListener("click", ()=>{

    if(clipEditMode){
        showClipModeNotice();
        return;
    }

    if(!activeIndices.length) return;

    activeIndices.forEach(index=>{

        const data = canvasData[index];

        // restore initial loaded state
        data.x = data.initialX;
        data.y = data.initialY;

        data.scale = data.initialScale;
        data.scaleX = null;
        data.scaleY = null;

        data.rotation = data.initialRotation;

        data.warpAmount = data.initialWarpAmount;
        data.arcAmount = data.initialArcAmount;
        data.opacity = data.initialOpacity;
        data.blurAmount = data.initialBlurAmount;
        data.blendMode = data.initialBlendMode;
        data.blendMode = data.initialBlendMode;

        applyWarpToData(data);
    });

    syncSliders();
});





document.getElementById("saveProgressBtn").addEventListener("click", ()=>{

    if(clipEditMode){
        showClipModeNotice();
        return;
    }

    const snapshot = canvasData.map(data=>{

        const mainObj = data.designObject;

        return {

            bgSrc: data.bg.src,
            bgName: data.bgName,

            designSrc: data.designOriginal ? data.designOriginal.src : null,
            designName: data.designName,

            x: mainObj ? mainObj.left : data.x,
            y: mainObj ? mainObj.top : data.y,

            scale: data.scale,

            scaleX: mainObj ? (mainObj.scaleX / data.previewScale) : data.scaleX,
            scaleY: mainObj ? (mainObj.scaleY / data.previewScale) : data.scaleY,

            rotation: mainObj ? mainObj.angle : data.rotation,

            warpAmount: data.warpAmount ?? 0,
            arcAmount: data.arcAmount ?? 0,
            opacity: data.opacity ?? 1,
            blurAmount: data.blurAmount ?? 0,
            blendMode: data.blendMode ?? "normal",

            maskPaths: data.maskPaths ?? [],
            maskPath: data.maskPath ?? null,
            maskEnabled: data.maskEnabled ?? false,
            maskType: data.maskType ?? null,

            filename: data.filename,

            duplicates: (data.extraDesignObjects || []).map(obj=>({

                left: obj.left,
                top: obj.top,

                scaleX: obj.scaleX / data.previewScale,
                scaleY: obj.scaleY / data.previewScale,

                angle: obj.angle
            }))
        };
    });

    const blob = new Blob(
        [JSON.stringify(snapshot, null, 2)],
        {type:'application/json'}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'mockup_progress.json';
    a.click();

    URL.revokeObjectURL(url);
});



async function createCanvasPreviewsFromSnapshot(snapshot){

    const container =
        document.getElementById("canvasContainer");

    const loadingIndicator =
        document.getElementById("loadingIndicator");

    container.innerHTML = "";
    canvasData = [];
    activeIndices = [];

    // rebuild source asset pools so future uploads
    // can multiply/populate correctly after JSON load
    backgrounds = [];
    designs = [];

    loadingIndicator.style.display = "block";

    for(let index = 0; index < snapshot.length; index++){

        const saved = snapshot[index];

        loadingIndicator.innerText =
            `Restoring session... ${index + 1} / ${snapshot.length}`;

        const bgImg = await new Promise(resolve=>{

            const img = new Image();

            img.onload = ()=>resolve(img);

            img.src = saved.bgSrc;
        });

        let designImg = null;

        if(saved.designSrc){

            designImg = await new Promise(resolve=>{

                const img = new Image();

                img.onload = ()=>resolve(img);

                img.src = saved.designSrc;
            });

            // restore design source pool
            if(
                !designs.some(
                    d => d.img && d.img.src === saved.designSrc
                )
            ){
                designs.push({
                    img: designImg,
                    name: saved.designName || ""
                });
            }
        }

        // restore background source pool
        if(
            !backgrounds.some(
                b => b.img && b.img.src === saved.bgSrc
            )
        ){
            backgrounds.push({
                img: bgImg,
                name: saved.bgName || ""
            });
        }

        const data = {

            bg: bgImg,
            bgName: saved.bgName,

            designOriginal: designImg,
            designName: saved.designName,

            x: saved.x,
            y: saved.y,

            scale: saved.scale,
            scaleX: saved.scaleX,
            scaleY: saved.scaleY,

            rotation: saved.rotation,

            warpAmount: saved.warpAmount,
            arcAmount: saved.arcAmount,

            opacity: saved.opacity ?? 1,
            blurAmount: saved.blurAmount ?? 0,
            blendMode: saved.blendMode ?? "normal",

            maskPaths:
                saved.maskPaths ||
                (saved.maskPath ? [saved.maskPath] : []),

            maskPath: saved.maskPath ?? null,
            maskEnabled: saved.maskEnabled ?? false,
            maskType: saved.maskType ?? null,

            // restore editable clipping editor state
            clipCurvePoints: saved.maskPath
                ? JSON.parse(JSON.stringify(saved.maskPath))
                : [],
            clipPolygonClosed:
                !!(
                    saved.maskEnabled &&
                    saved.maskPath &&
                    saved.maskPath.length >= 3
                ),

            filename: saved.filename,

            extraDesignObjects: [],

            initialX: saved.x,
            initialY: saved.y,

            initialScale: saved.scale,
            initialRotation: saved.rotation,
            initialWarpAmount: saved.warpAmount,
            initialArcAmount: saved.arcAmount,
            initialOpacity: saved.opacity ?? 1,
            initialBlurAmount: saved.blurAmount ?? 0,
            initialBlendMode: saved.blendMode ?? "normal"
        };

        canvasData.push(data);

        const wrapper = document.createElement("div");
        wrapper.className = "canvas-wrapper";

        const canvasEl = document.createElement("canvas");

        wrapper.appendChild(canvasEl);

        const filenameInput = document.createElement("input");

        filenameInput.type = "text";
        filenameInput.className = "filename-input";
        filenameInput.value = saved.filename;

        filenameInput.addEventListener("input", e=>{
            data.filename = e.target.value;
        });

        wrapper.appendChild(filenameInput);

        container.appendChild(wrapper);

        const fabricCanvas = new fabric.Canvas(canvasEl,{
            preserveObjectStacking: true,
            selection: false,
            renderOnAddRemove: false
        });

        data.fabricCanvas = fabricCanvas;

        const realWidth = bgImg.width;

        const containerWidth = container.clientWidth;

        const targetColumnWidth =
            Math.min(420, (containerWidth - 100) / 4);

        const previewScale =
            Math.min(1, targetColumnWidth / realWidth);

        data.previewScale = previewScale;

        fabricCanvas.setWidth(bgImg.width * previewScale);
        fabricCanvas.setHeight(bgImg.height * previewScale);

        wrapper.style.width =
            (bgImg.width * previewScale) + "px";

        const bgFabric = await new Promise(resolve=>{

            fabric.Image.fromURL(saved.bgSrc, resolve,{
                crossOrigin:'anonymous'
            });
        });

        bgFabric.set({
            left:0,
            top:0,
            selectable:false,
            evented:false,
            originX:'left',
            originY:'top',
            scaleX:previewScale,
            scaleY:previewScale
        });

        fabricCanvas.add(bgFabric);

        // restore polygon overlay before rendering designs
        addClipOverlay(data);

        await applyWarpToData(data,false);
        await new Promise(r=>setTimeout(r,40));

        if(saved.duplicates?.length){

            for(const dup of saved.duplicates){

                await new Promise(resolve=>{

                    data.designObject.clone(cloned=>{

                        cloned.set({
                            left: dup.left,
                            top: dup.top,

                            scaleX:
                                dup.scaleX * previewScale,

                            scaleY:
                                dup.scaleY * previewScale,

                            angle: dup.angle,

                            opacity:
                                dup.opacity ?? data.opacity,

                            globalCompositeOperation:
                                dup.blendMode === 'multiply'
                                    ? 'multiply'
                                    : dup.blendMode === 'screen'
                                        ? 'screen'
                                        : 'source-over'
                        });

                        data.extraDesignObjects.push(cloned);

                        fabricCanvas.add(cloned);

                        attachFabricEvents(data, cloned);

                        resolve();
                    });
                });
            }
        }

        addClipOverlay(data);

                fabricCanvas.requestRenderAll();

        wrapper.addEventListener('click', function(e){

            if(suppressNextWrapperClick){
                return;
            }

            if(clipEditMode){
                return;
            }

                if(editMode === "design"){

                    if(index !== activeDesignWindow){
                        return;
                    }

                    activeIndices = [activeDesignWindow];

                    updateWindowBorders();
                    syncSliders();
                    updateSelectButtonState();

                    return;
                }

                const isModifierMultiSelect = e.metaKey || e.ctrlKey;

                // SHIFT = range select
                if(e.shiftKey){

                    if(lastSelectedIndex === null){

                        activeIndices = [index];

                    } else {

                        const start = Math.min(lastSelectedIndex, index);
                        const end = Math.max(lastSelectedIndex, index);

                        const range = [];

                        for(let i = start; i <= end; i++){
                            range.push(i);
                        }

                        activeIndices = [...new Set([
                            ...activeIndices,
                            ...range
                        ])];
                    }

                // CMD / CTRL = individual toggle select
                } else if(isModifierMultiSelect){

                    if(activeIndices.includes(index)){

                        activeIndices =
                            activeIndices.filter(i => i !== index);

                    } else {

                        activeIndices.push(index);
                    }

                    lastSelectedIndex = index;

                // normal click = single select
                } else {

                    activeIndices = [index];

                    lastSelectedIndex = index;
                }

                if(e.shiftKey){
                    lastSelectedIndex = index;
                }

                updateWindowBorders();

                syncSliders();
                updateSelectButtonState();
            });
            attachClipDrawing(
                wrapper,
                fabricCanvas,
                data,
                index
            );

    }

    loadingIndicator.innerText =
        "Session restored";

    setTimeout(()=>{
        loadingIndicator.style.display = "none";
    },800);
}


document.getElementById("loadProgressBtn").addEventListener("click", ()=>{

    if(clipEditMode){
        showClipModeNotice();
        return;
    }

    document.getElementById("loadProgressInput").click();
});

document.getElementById("loadProgressInput").addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = async function(e){

        const snapshot = JSON.parse(e.target.result);

        await createCanvasPreviewsFromSnapshot(snapshot);

        syncSliders();
        updateWindowBorders();
    };

    reader.readAsText(file);
});


let resizeTimer;

window.addEventListener('resize', ()=>{

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(()=>{

        if(backgrounds.length){
            createCanvasPreviews();
        }

    }, 150);
});

</script>

<style>
body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; }
.sticky-header {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 1000;
    border-bottom: 1px solid #ccc;
    padding: 10px 0;
}
.controls {
    margin: 10px;
    display: flex;
    justify-content: center;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
}
.controls label {
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.controls input[type="range"],
.controls input[type="number"] {
    width: 90px;
    padding: 4px;
    font-size: 14px;
    text-align: center;
}
.canvas-container {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
    align-items: start;
}

.canvas-container > * {
    min-width: 0;
}

@media (max-width: 1400px) {
    .canvas-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 1050px) {
    .canvas-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    .canvas-container {
        grid-template-columns: repeat(1, minmax(0, 1fr));
    }
}
.canvas-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    border: 2px solid transparent;
    width: 100%;
    max-width: 420px;
    min-width: 0;
    overflow: hidden;
    vertical-align: top;
    box-sizing: border-box;
    align-items: center;
    justify-self: center;
}

.canvas-wrapper canvas {
    width: 100% !important;
    height: auto !important;
    display: block;
}



.filename-input {
    margin-top: 5px;
    width: calc(100% - 12px);
    max-width: 100%;
    box-sizing: border-box;
}

.canvas-wrapper.active {
    border: 2px solid #1e5eff !important;
    box-shadow: 0 0 0 1px #1e5eff;
}
.canvas-wrapper.design-active {
    border: 2px solid orange !important;
    box-shadow: 0 0 0 1px orange;
}


#deleteClipBtn{
    background:#ff2b2b !important;
    color:white !important;
    border:2px solid black !important;
    padding:8px 12px !important;
    font-weight:bold !important;
}
</style>
</head>
<body>

<div class="sticky-header">
    <h1>mockup scripter</h1>

    <div>
        <button id="selectAllBtn">Select All</button>
        <input type="file" id="bgUpload" accept="image/png, image/jpeg" multiple>
        <input type="file" id="designUpload" accept="image/png, image/jpeg" multiple>
        <button id="exportBtn">Export Selected</button>
        <button id="saveProgressBtn">Save Progress</button>
        <button id="loadProgressBtn">Load Progress</button>
        <input type="file" id="loadProgressInput" accept=".json" style="display:none;">
    </div>

    <div class="controls">

        <label>Cylinder Warp
            <input type="range" id="warpAmount" min="0" max="100" value="0">
        </label>

        <label>Vertical Arc
            <input type="range" id="arcAmount" min="-100" max="100" value="0">
        </label>

        <label>Horizontal Perspective
            <input type="range" id="perspectiveTop" min="-100" max="100" value="0">
        </label>

        <label>Vertical Perspective
            <input type="range" id="perspectiveLeft" min="-100" max="100" value="0">
        </label>

        <label>Opacity %
            <input type="number" id="opacityAmount" min="0" max="100" step="1" value="100">
        </label>

        <label>Gaussian Blur %
            <input type="number" id="blurAmount" min="0" max="100" step="1" value="0">
        </label>

        <label>Layer Mode
            <select id="blendMode">
                <option value="normal">Normal</option>
                <option value="multiply">Multiply</option>
                <option value="screen">Screen</option>
            </select>
        </label>

        <button id="designModeBtn">Design Mode</button>
        <button id="duplicateDesignBtn" style="display:none;">Duplicate Design</button>
        <button id="deleteDesignBtn" style="display:none;">Delete Design</button>
        <button id="editClipBtn">Edit Clipping</button>
<button id="addClipAreaBtn" style="display:none;">Add Clipping Area</button>
<button id="deleteClipBtn" style="display:inline-block !important; visibility:visible !important; opacity:1 !important; z-index:99999; position:relative;">Delete Clipping</button>
        <button id="resetBtn">Reset Selected</button>
    </div>
</div>


<div id="loadingIndicator" style="
display:none;
position:fixed;
top:80px;
right:20px;
background:#111;
color:#fff;
padding:10px 14px;
border-radius:8px;
z-index:9999;
font-size:14px;
font-family:Arial;
">
Preparing designs...
</div>

<div class="canvas-container" id="canvasContainer"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
